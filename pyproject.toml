[project]
name = "career-radar"
version = "0.1.0"
description = "Autonomous career radar and recruitment intelligence tracking system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "pypdf>=6.16.1",
    "python-docx>=1.2.0",
    "pyyaml>=6.0.1",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/career_radar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
