[project]
name = "career-radar"
version = "0.1.0"
description = "Autonomous career radar and recruitment intelligence tracking system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/career_radar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
